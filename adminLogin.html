<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EcoLearn Admin Login</title>
    <link rel="stylesheet" href="adminLogin.css" />
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&icon_names=temp_preferences_eco" />
</head>

<body>
    <div class="login-wrapper">
        <div class="login-card">
            <h2><span class="material-symbols-outlined">temp_preferences_eco</span> EcoLearn Admin Portal</h2>
            <form id="adminLoginForm">
                <div class="input-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" placeholder="admin-email@domain.com" required />
                </div>
                <div class="input-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" placeholder="Password" required />
                </div>
                <div class="input-group">
                    <label for="role">Login As</label>
                    <select id="role" required>
                        <option value="">Select Role</option>
                        <option value="admin">Admin</option>
                        <option value="faculty">Faculty</option>
                    </select>
                </div>
                <button type="submit">Login</button>
                <p id="errorMsg"></p>
            </form>
        </div>
    </div>
    <script src="adminLogin.js"></script>
</body>

</html>

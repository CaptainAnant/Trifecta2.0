<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EcoLearn | Login</title>
  <link rel="stylesheet" href="login.css">
  <!-- Google Fonts - Poppins -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet" />
</head>
<body>
  <div class="page-container">
    <!-- LEFT PANEL -->
    <div class="left-panel">
      <div class="left-content">
        <div class="logo-icons">
          <span class="material-symbols-outlined">eco</span>
          <span class="material-symbols-outlined">forest</span>
          <span class="material-symbols-outlined">grass</span>
        </div>
        <h1 class="brand-title">EcoLearn</h1>
        <p class="brand-subtitle">Gamified Environmental Education for a Sustainable Future</p>
        <div class="stats-container">
          <div class="stat-item">1K+ <span>Students</span></div>
          <div class="stat-item">20+ <span>Schools</span></div>
          <div class="stat-item">50+ <span>Trees Planted</span></div>
        </div>
      </div>
    </div>

    <!-- RIGHT PANEL -->
    <div class="right-panel">
      <div class="login-card" id="authCard">
        <h2 class="card-title" id="cardTitle">Welcome Back! 👋</h2>
        <p class="card-subtitle" id="cardSubtitle">Continue your journey to make India greener</p>
        
        <!-- Form -->
        <form id="authForm">
          <div class="form-group">
            <label for="email">Email</label>
            <input class="form-input" type="email" id="email" placeholder="your.email@school.edu" required>
          </div>
          <div class="form-group">
            <label for="password">Password</label>
            <input class="form-input" type="password" id="password" placeholder="Enter your password" required>
          </div>
          <button type="submit" class="submit-btn">
            <span class="material-symbols-outlined">eco</span> Log In
          </button>
        </form>

        <p class="card-footer-text" id="authFooter">
          Don't have an account? <a href="#" id="toggleToSignUp">Join EcoLearn</a>
        </p>
      </div>
    </div>
  </div>
  <script src="login.js"></script>
</body>
</html>
